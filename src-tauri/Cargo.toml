[package]
name = "ollama-workshop"
version = "0.2.0"
description = "Local model management and repository fine-tuning"
edition = "2021"
[features]
desktop-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
